<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grande Dia - Casamento Samuel e Ana</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Great Vibes (Caligrafia sem cortes) & Cormorant Garamond / Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Great+Vibes&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">

    <style>
        /* Tipografias */
        .font-script {
            font-family: 'Great Vibes', cursive;
        }
        .font-serif-luxury {
            font-family: 'Cormorant Garamond', serif;
        }
        .font-sans-clean {
            font-family: 'Montserrat', sans-serif;
        }

        /* Fundo Pérola Suave com Degradê Luminescente */
        body {
            background: radial-gradient(circle at 50% 35%, #FFFFFF 0%, #FFFDF9 35%, #FBF8F3 70%, #FAF5ED 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            color: #4A4238;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Dourado Elegante em Gradiente para o Título */
        .gold-gradient-text {
            background: linear-gradient(135deg, #B89748 0%, #D4AF37 50%, #C5A059 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            /* Ajuste crítico para impedir qualquer corte das hastes e ornamentos da fonte */
            line-height: 1.5 !important;
            padding-top: 0.2em;
            padding-bottom: 0.25em;
            padding-left: 0.15em;
            padding-right: 0.15em;
            overflow: visible !important;
            display: inline-block;
        }

        /* Card de Vidro Perolado (Pearl Glassmorphism) */
        .pearl-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow: 0 15px 35px rgba(184, 151, 72, 0.08),
                        0 5px 15px rgba(0, 0, 0, 0.03),
                        inset 0 0 20px rgba(255, 255, 255, 0.9);
        }

        /* Partículas / Brilhos Flutuantes Perolados */
        .sparkle {
            position: absolute;
            background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(245,235,215,0.8) 60%, rgba(255,255,255,0) 100%);
            border-radius: 50%;
            pointer-events: none;
            animation: floatSparkle 8s infinite ease-in-out;
        }

        @keyframes floatSparkle {
            0%, 100% {
                transform: translateY(0) scale(1);
                opacity: 0.35;
            }
            50% {
                transform: translateY(-20px) scale(1.15);
                opacity: 0.75;
            }
        }

        /* Animação Suave de Revelação */
        .fade-in-up {
            animation: fadeInUp 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="relative p-4 sm:p-8 select-none">

    <!-- Brilhos perolados ambientais -->
    <div class="sparkle w-40 h-40 top-8 left-8 opacity-40 blur-md" style="animation-delay: 0s;"></div>
    <div class="sparkle w-56 h-56 bottom-12 right-10 opacity-30 blur-lg" style="animation-delay: 2s;"></div>
    <div class="sparkle w-32 h-32 top-1/4 right-1/4 opacity-50 blur-sm" style="animation-delay: 4s;"></div>
    <div class="sparkle w-48 h-48 bottom-1/4 left-1/6 opacity-35 blur-md" style="animation-delay: 1s;"></div>

    <!-- Moldura de Borda Dupla Delicada -->
    <div class="fixed inset-3 sm:inset-6 border border-[#D4AF37]/20 pointer-events-none rounded-2xl z-0"></div>
    <div class="fixed inset-5 sm:inset-8 border border-[#D4AF37]/10 pointer-events-none rounded-xl z-0"></div>

    <!-- Conteúdo Principal Centralizado -->
    <main class="relative z-10 max-w-4xl w-full text-center my-auto py-8 px-4 sm:px-10 fade-in-up">
        
        <!-- Ornamento Floral SVG em Dourado Suave -->
        <div class="flex justify-center mb-3 sm:mb-5 opacity-80">
            <svg class="w-16 h-16 sm:w-20 sm:h-20 text-[#C5A059]" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1">
                <path d="M50,15 C40,30 25,35 15,50 C25,65 40,70 50,85 C60,70 75,65 85,50 C75,35 60,30 50,15 Z" fill="none" stroke-opacity="0.35"/>
                <circle cx="50" cy="50" r="3.5" fill="#D4AF37" fill-opacity="0.7"/>
                <path d="M35,50 Q50,40 65,50" stroke-opacity="0.45"/>
                <path d="M38,56 Q50,48 62,56" stroke-opacity="0.3"/>
            </svg>
        </div>

        <!-- Título Principal ("GRANDE DIA") com Altura Adequada sem Cortes -->
        <div class="w-full overflow-visible">
            <h1 class="font-script text-6xl sm:text-8xl md:text-9xl gold-gradient-text drop-shadow-sm tracking-wide">
                Grande Dia
            </h1>
        </div>

        <!-- Subtítulo -->
        <p class="font-serif-luxury text-2xl sm:text-3xl md:text-4xl text-[#5C5245] mt-1 sm:mt-2 tracking-widest font-light uppercase">
            Casamento Samuel <span class="font-script lowercase text-3xl sm:text-4xl md:text-5xl text-[#C5A059] mx-1">&</span> Ana
        </p>

        <!-- Data do Evento -->
        <p class="font-sans-clean text-xs sm:text-sm tracking-[0.3em] text-[#8C7F70] mt-3 uppercase font-medium">
            17 de Dezembro de 2026
        </p>

        <!-- Divisor Elegante -->
        <div class="flex items-center justify-center my-8 sm:my-10">
            <div class="h-[1px] w-16 sm:w-28 bg-gradient-to-r from-transparent to-[#D4AF37]/50"></div>
            <div class="mx-3 text-[#D4AF37] text-xs">◆</div>
            <div class="h-[1px] w-16 sm:w-28 bg-gradient-to-l from-transparent to-[#D4AF37]/50"></div>
        </div>

        <!-- Contador Regressivo -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 sm:gap-6 max-w-3xl mx-auto">
            
            <!-- Dias -->
            <div class="pearl-card rounded-2xl p-4 sm:p-6 transition-all duration-300 hover:-translate-y-1 hover:shadow-lg">
                <span id="days" class="block font-serif-luxury text-4xl sm:text-5xl md:text-6xl font-normal text-[#3D352E]">
                    00
                </span>
                <span class="block font-sans-clean text-xs sm:text-sm text-[#8C7F70] tracking-widest uppercase mt-2 font-medium">
                    Dias
                </span>
            </div>

            <!-- Horas -->
            <div class="pearl-card rounded-2xl p-4 sm:p-6 transition-all duration-300 hover:-translate-y-1 hover:shadow-lg">
                <span id="hours" class="block font-serif-luxury text-4xl sm:text-5xl md:text-6xl font-normal text-[#3D352E]">
                    00
                </span>
                <span class="block font-sans-clean text-xs sm:text-sm text-[#8C7F70] tracking-widest uppercase mt-2 font-medium">
                    Horas
                </span>
            </div>

            <!-- Minutos -->
            <div class="pearl-card rounded-2xl p-4 sm:p-6 transition-all duration-300 hover:-translate-y-1 hover:shadow-lg">
                <span id="minutes" class="block font-serif-luxury text-4xl sm:text-5xl md:text-6xl font-normal text-[#3D352E]">
                    00
                </span>
                <span class="block font-sans-clean text-xs sm:text-sm text-[#8C7F70] tracking-widest uppercase mt-2 font-medium">
                    Minutos
                </span>
            </div>

            <!-- Segundos -->
            <div class="pearl-card rounded-2xl p-4 sm:p-6 transition-all duration-300 hover:-translate-y-1 hover:shadow-lg">
                <span id="seconds" class="block font-serif-luxury text-4xl sm:text-5xl md:text-6xl font-normal text-[#3D352E]">
                    00
                </span>
                <span class="block font-sans-clean text-xs sm:text-sm text-[#8C7F70] tracking-widest uppercase mt-2 font-medium">
                    Segundos
                </span>
            </div>

        </div>

        <!-- Frase do Rodapé Exata -->
        <p class="font-serif-luxury italic text-lg sm:text-xl text-[#7C6F60] mt-10 sm:mt-14 font-normal tracking-wide">
            Contando cada segundo para nunca mais dizer "tchau"!
        </p>

    </main>

    <script>
        // Data alvo: 17 de Dezembro de 2026 às 00:00:00
        const targetDate = new Date('December 17, 2026 00:00:00').getTime();

        function padZero(num) {
            return num < 10 ? `0${num}` : num;
        }

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            const daysElem = document.getElementById('days');
            const hoursElem = document.getElementById('hours');
            const minutesElem = document.getElementById('minutes');
            const secondsElem = document.getElementById('seconds');

            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                daysElem.innerText = padZero(days);
                hoursElem.innerText = padZero(hours);
                minutesElem.innerText = padZero(minutes);
                secondsElem.innerText = padZero(seconds);
            } else {
                daysElem.innerText = "00";
                hoursElem.innerText = "00";
                minutesElem.innerText = "00";
                secondsElem.innerText = "00";
            }
        }

        // Executa imediatamente ao carregar e atualiza a cada 1 segundo
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
